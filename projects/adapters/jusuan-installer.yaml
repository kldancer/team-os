version: 1
id: jusuan-platform
name: 聚算平台总控工程
root: /Users/kailonyang/go/src/jusuan-installer
mode: read-only
authority:
  agents: AGENTS.md
  workflow: docs/平台开发联调部署规范.md
  designIndex: docs/README.md
  designGovernance: docs/设计文档管理规范.md
  designMap: docs/正式设计文档/00-系统设计地图.md
  designGraph: docs/正式设计文档/design-graph.json
  environmentIndex: docs/生产环境建设/README.md
  environmentMap: docs/生产环境建设/00-环境地图.md
  environmentGraph: docs/生产环境建设/environment-graph.json
  production: docs/正式设计文档/25-生产变更兼容性发布与真实入口验收设计.md
machine:
  planner: ./juspctl
  designQuery: python3 .agents/scripts/design_catalog.py query
  designImpact: python3 .agents/scripts/design_catalog.py impact
  designGate: bash scripts/validate/docs/verify_ai_doc_system_contract.sh
  environmentQuery: python3 .agents/scripts/environment_catalog.py query
  environmentImpact: python3 .agents/scripts/environment_catalog.py impact
  environmentGate: bash scripts/validate/docs/verify_environment_doc_contract.sh
  workspaces: .agents/config/workspaces.json
  gates: .agents/config/gates.json
evidence:
  taskStore: .work/tasks
  codexRuntimeAdapter: ~/.codex/skills/team-os-codex/scripts/project_bridge.py
  gateReceipts: .work/gates
constraints:
  copyAuthorityDocuments: false
  # 只有用户在当前 harness Session 中明确触发“按结论开始推进”后，
  # 才允许结果合同申请项目内本地实现、文档与适用验证；不含 Git、远端和生产。
  allowRuntimeWrite: true
  allowProductionWrite: false
  allowGitMutation: false
