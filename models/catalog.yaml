version: 3
reviewedAt: 2026-09-14
policy: capability-first-explicit-runtime-binding
capabilityProfiles:
  owner:
    requires: [reliable-tool-use, instruction-following, session-continuity, final-synthesis]
  fast:
    requires: [low-latency, bounded-read-tools, concise-evidence]
  review:
    requires: [independent-model-family, falsification, read-only-operation]
  vision:
    requires: [image-input, visual-evidence]
  slow:
    requires: [complex-reasoning, bounded-high-cost-use]
runtimePolicy:
  preferredHarness: omp
  compatibilityBaseline: pi
  migrationFallback: codex
  bindingLocation: runtime-user-config
  rule: Team OS 不保存凭据，不因角色名或失败静默切换模型/Provider
activePortfolio:
  id: omp-sol-astra-deepseek-v1
  scope: omp-interactive-software-work
  evidencePolicy: official-capability-plus-local-task-observation
  defaults:
    outcomeOwner: gpt-5.6-sol
    planningOwner: gpt-5.6-sol
    finalSynthesis: gpt-5.6-sol
    crossBoundaryDesign: gpt-5.6-sol
    generalImplementation: deepseek-flash
    leafExecution: deepseek-flash
    uiDeepDesign: gpt-6-astra
    frontendDeepReview: gpt-6-astra
    architectureChallenge: gpt-6-astra
    fastScout: deepseek-flash
    boundedParallelImplementation: deepseek-flash
    independentFamilyReview: deepseek-flash
  reservedRoles:
    - outcomeOwner
    - planningOwner
    - crossBoundaryDesign
    - uiDeepDesign
    - frontendDeepReview
    - finalSynthesis
  defaultExecutionRule: 保留角色由 @plan_owner/@ui_deep/@deep_review 绑定；执行档由 @fast_worker 与 task.agentModelOverrides 落实；default 角色保留给主 Session 与未绑定回退，指向保留档，不得把执行工作带回 GPT
  ompTaskAgentModelOverrides:
    task: "@fast_worker"
    scout: "@fast_worker"
    sonic: "@fast_worker"
  ompRoleAliases:
    plan_owner: gpt-5.6-sol
    ui_deep: gpt-6-astra
    deep_review: gpt-6-astra
    fast_worker: deepseek-flash
  ompResolvedSelectors:
    default: cliproxyapi/gpt-5.6-sol
    plan_owner: cliproxyapi/gpt-5.6-sol
    ui_deep: cliproxyapi/gpt-6-astra
    deep_review: cliproxyapi/gpt-6-astra
    fast_worker: teamorouter/deepseek-flash
  providerRoutes:
    openaiModels: local-loopback-cliproxyapi-over-codex-oauth
    deepseekModel: direct-deepseek-api-key
    noSilentCrossProviderFallback: true
  models:
    gpt-5.6-sol:
      admission: default-owner
      evidence:
        official: flagship-for-complex-professional-work
        local: preferred-for-planning-and-main-implementation
      strengths:
        - scope-and-plan-synthesis
        - cross-boundary-design-and-state-freeze
        - ambiguous-implementation-that-cannot-yet-be-written-as-a-worker-pack
        - tool-use-and-debugging-continuity
        - integration-review-and-final-report
      avoid:
        - routine-bounded-implementation-with-a-complete-worker-pack
        - low-value-bulk-read-that-a-fast-worker-can-return-as-bounded-evidence
        - exploring-source-or-documents-instead-of-consuming-a-scout-pack
      handoffContract: owns-outcome-plan-worker-packs-integration-review-and-final-synthesis
    gpt-6-astra:
      admission: specialist-only-by-default
      evidence:
        official: hardest-work-complex-reasoning-coding-computer-use-and-research
        local: general-implementation-over-prepares-and-expands-verification
      strengths:
        - deep-ui-and-ux-design
        - frontend-architecture-and-interaction-state-review
        - difficult-cross-boundary-design-challenge
        - high-risk-independent-review
        - visual-and-computer-use-evidence
      avoid:
        - default-outcome-owner
        - routine-general-implementation
        - repository-wide-preparation-without-an-explicit-evidence-question
        - broad-build-or-test-selection
      requiresExplicitOverrideFor: [outcome-owner, general-implementation, production-write]
      handoffContract: returns-decisions-findings-acceptance-and-evidence-to-current-owner
    deepseek-flash:
      admission: fast-specialist-with-bounded-write
      runtimeModelId: deepseek-flash
      displayName: DeepSeek V4.1 Flash
      runtimeContextWindow: 1000000
      evidence:
        official: high-throughput-efficient-agentic-and-native-multimodal
        local: omp-provider-and-project-write-gates-still-required
      strengths:
        - fast-repository-scouting-and-compressed-evidence-packs
        - bounded-fact-research
        - batch-classification-and-mechanical-analysis
        - independent-model-family-challenge
        - pack-driven-bounded-implementation
        - leaf-executor-runs-gates-smoke-refresh-production-preflight
        - mechanical-doc-updates-and-commit-preparation
        - model-token-and-context-accounting
      avoid:
        - final-outcome-synthesis
        - ambiguous-cross-boundary-design-ownership
        - writing-outside-the-worker-pack-write-set
        - migration-or-production-write-without-explicit-authorization-and-gates
      promotionGate:
        - provider-and-tool-resolution-proven
        - session-stop-and-resume-proven
        - assigned-write-set-is-exclusive
        - target-tests-and-diff-reviewed-by-owner
      handoffContract: returns-bounded-evidence-or-patch-and-target-validation-to-current-owner
  routingRules:
    - one-outcome-has-one-owner
    - reserved-roles-are-explicitly-bound-and-never-default
    - non-reserved-work-runs-on-the-runtime-default-model
    - terminal-mechanical-lanes-commit-push-doc-fix-need-no-role-binding
    - every-dispatch-carries-a-self-sufficient-worker-pack
    - workers-never-exceed-the-worker-pack-write-set
    - fallback-never-silently-changes-owner-or-upgrades-to-a-gpt-tier
candidates:
  - id: google-gemini
    models: [gemini-3.7-flash, gemini-cli-auto]
    intendedRoles: [multimodal-scout, long-context-evidence-researcher]
    distinctChannels: [native-multimodal, million-token-context, independent-model-family]
    runtimeStatus: not-installed-by-team-os
    admission: real-task-evidence-required
  - id: deepseek-v4
    models: [deepseek-flash, deepseek-v4-pro]
    intendedRoles: [leaf-executor, pack-driven-implementation, evidence-scout, cost-sensitive-batch-specialist]
    distinctChannels: [independent-model-family, open-weights-option, million-token-context]
    runtimeStatus: omp-role-binding-active-as-default-and-fast-worker
    admission: fast-specialist-active-owner-promotion-requires-real-task-evidence
  - id: xai-grok
    models: [grok-4.6]
    intendedRoles: [freshness-researcher, open-world-challenger, interactive-prototype-reviewer]
    distinctChannels: [web-search, x-search, independent-model-family]
    runtimeStatus: not-installed-by-team-os
    admission: highest-priority-new-pilot
  - id: moonshot-kimi
    models: [kimi-code/k3]
    intendedRoles: [chinese-knowledge-worker, long-document-analyst, multimodal-office-specialist]
    distinctChannels: [native-chinese, native-multimodal, million-token-context, independent-model-family]
    runtimeStatus: not-installed-by-team-os
    admission: second-priority-new-pilot
  - id: alibaba-qwen
    models: [qwen3-coder-plus, qwen3-coder-open-weight-family]
    intendedRoles: [chinese-coding-specialist, open-model-backup, local-private-experiment]
    distinctChannels: [chinese-code-ecosystem, separate-open-weight-deployment-option, independent-model-family]
    runtimeStatus: not-installed-by-team-os
    admission: conditional-pilot-after-overlap-review
excluded:
  - vendor: Anthropic
    reason: user-requested-exclusion
deferred:
  - group: additional-frontier-models
    reason: no-proven-unique-channel-or-stable-runtime-contract-yet
