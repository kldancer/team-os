version: 3
reviewedAt: 2026-09-18
policy: capability-first-explicit-runtime-binding
capabilityProfiles:
  owner:
    requires: [reliable-tool-use, instruction-following, session-continuity, final-synthesis]
  fast:
    requires: [low-latency, bounded-read-tools, concise-evidence]
  review:
    requires: [independent-model-family, falsification, read-only-operation]
  vision:
    requires: [image-input, visual-evidence]
  slow:
    requires: [complex-reasoning, bounded-high-cost-use]
runtimePolicy:
  preferredHarness: omp
  compatibilityBaseline: pi
  migrationFallback: codex
  bindingLocation: runtime-user-config
  rule: Team OS 不保存凭据，不因角色名或失败静默切换模型/Provider
activePortfolio:
  id: cn-gpt-k3-glm-ds-v2
  scope: omp-interactive-software-work
  evidencePolicy: official-capability-plus-local-task-observation
  # 档位属于「角色」而不是「模型家族」：换绑不换档，热替换才成立。
  roleTiers:
    default: analysis
    plan_owner: analysis
    plan_alt: adjudication
    deep_review: adjudication
    ui_deep: vision
    ui_qa: vision
    fast_worker: execution
    ui_impl: execution
    fast_alt: execution
  roleBindingPolicy:
    sourceOfTruth: ompResolvedSelectors
    roleContract: roleTiers
    defaultModel: cliproxyapi/gpt-5.6-sol
    sessionOverride:
      supported: true
      disclosure: required
      scope: current-session-only
      restore: clear-temporary-binding
    persistentOverride:
      supported: true
      location: runtime-user-config.modelRoles
      audit: check_model_routes.py
    fallback:
      source: ompAgentFallbacks
      silentProviderSwitch: forbidden
      resolvedModelBadge: required
    changePhrase: "<role>角色变更为<model>"
  defaults:
    outcomeOwner: cliproxyapi/gpt-5.6-sol
    planningOwner: cliproxyapi/gpt-5.6-sol
    reviewPlanning: kimi-code/k3-256k
    visualAcceptance: kimi-code/k3
    finalSynthesis: cliproxyapi/gpt-5.6-sol
    crossBoundaryDesign: cliproxyapi/gpt-5.6-sol
    deepReview: zhipu-coding-plan/glm-5.3
    architectureChallenge: cliproxyapi/gpt-6-astra
    uiDeepDesign: kimi-code/k3
    uiQa: zhipu-coding-plan/glm-5.3-flash
    frontendDeepReview: zhipu-coding-plan/glm-5.3
    generalImplementation: zhipu-coding-plan/glm-5.3-flash
    leafExecution: zhipu-coding-plan/glm-5.3-flash
    fastScout: zhipu-coding-plan/glm-5.3-flash
    boundedParallelImplementation: zhipu-coding-plan/glm-5.3-flash
    frontendImplementation: teamorouter/deepseek-flash
    independentFamilyReview: teamorouter/deepseek-flash
  reservedRoles:
    - outcomeOwner
    - planningOwner
    - crossBoundaryDesign
    - deepReview
    - architectureChallenge
    - uiDeepDesign
    - frontendDeepReview
    - finalSynthesis
  defaultExecutionRule: 分析/研判/视觉三档由 @plan_owner/@deep_review/@ui_deep 显式绑定；执行档由 @fast_worker 与 task.agentModelOverrides 落实；default 角色指向分析档（主 Session 与未绑定回退）
  quotaWindows:
    kimi-membership:
      channel: kimi-code
      sharedPool: true
      windows: ["5h", "weekly"]
      publishedValues: "unknown"
      warmAt: 0.7
      downgradeAt: 0.9
      onExhausted:
        # kimi 现承载 plan_alt(起草)/deep_review(红队)/ui_deep(设计判断)/fast_alt
        rebindPlanAlt: zhipu-coding-plan/glm-5.3
        rebindDeepReview: cliproxyapi/gpt-6-astra
        rebindUiDeep: zhipu-coding-plan/glm-5.3-flash
        keepOwner: true
        disclose: kimi-exhaustion-moves-review-to-standby-and-drafts-to-glm-owner-tier
        resumeWhen: window-resets-and-usage_history-reports-ok
      note: 订阅额度池与网页/Agent/深度研究/幻灯片/文档/表格/Kimi Code/Kimi Work 共享
    zhipu-coding-plan:
      channel: zhipu-coding-plan
      sharedPool: true
      windows: ["5h", "weekly"]
      publishedValues: "points"
      warmAt: 0.7
      downgradeAt: 0.9
      onExhausted:
        # zhipu 现承载 deep_review；owner(default/plan_owner) 走 CLIProxyAPI。
        rebindFastWorker: teamorouter/glm-5.3-flash-free
        rebindUiQa: teamorouter/glm-5.3-flash
        disclose: zhipu-exhaustion-swaps-review-to-kimi-standby-and-workers-to-payg-pool
        resumeWhen: window-resets-and-usage_history-reports-ok
      note: 高峰 3 倍积分（GLM-5.3）/1.2 倍（Flash），非高峰 1 倍/0.4 倍；重活排非高峰
  ompTaskAgentModelOverrides:
    task: "@fast_worker"
    scout: "@fast_worker"
    sonic: "@fast_worker"
  ompRoleAliases:
    plan_owner: cliproxyapi/gpt-5.6-sol
    plan_alt: kimi-code/k3-256k
    deep_review: zhipu-coding-plan/glm-5.3
    ui_deep: kimi-code/k3
    ui_qa: zhipu-coding-plan/glm-5.3-flash
    fast_worker: zhipu-coding-plan/glm-5.3-flash
    ui_impl: teamorouter/deepseek-flash
    fast_alt: kimi-code/kimi-for-coding-highspeed
  ompResolvedSelectors:
    default: cliproxyapi/gpt-5.6-sol
    plan_owner: cliproxyapi/gpt-5.6-sol
    plan_alt: kimi-code/k3-256k
    deep_review: zhipu-coding-plan/glm-5.3
    ui_deep: kimi-code/k3
    ui_qa: zhipu-coding-plan/glm-5.3-flash
    fast_worker: zhipu-coding-plan/glm-5.3-flash
    ui_impl: teamorouter/deepseek-flash
    fast_alt: kimi-code/kimi-for-coding-highspeed
  temporaryBindings: {}
  dispatchPolicy:
    failureBudget: 2
    cadenceMinutes: 20
    # 每条 advisory 必须能被翻译成下一次派工的执行约束；没有条款的 advisory 不允许存在。
    advisoryInjections:
      owner-wait-share-high: 每 20 分钟结构化回报一次进展；禁止轮询等待，等待期间推进证据或裁决
      owner-execution-share-high: 批量读取、命令执行与机械改动一律派执行档；主线只做决策、派工与收据
      context-median-high: 证据包限 ≤30 行且带 文件:行号；禁止整份读取；大输出先落盘再摘要
      worker-cadence-missing: "每个验收点必须回传 VERDICT: <验收点> PASS|FAIL 并附证据引用"
      stop-marker-recorded: 未产出重定界决策前不得重试或重建；回规划裁决改验收或改 owner
      planning-not-half-to-adjudication: 覆盖型规划草稿交 @plan_alt 起草，分析档只做裁决
    note: 同一验收点连续失败到该轮数即停线回规划；两处脚本与文档都读这里，不各写一个字面量
  standbySelectors:
    plan_owner: zhipu-coding-plan/glm-5.3
    plan_alt: cliproxyapi/gpt-5.6-sol
    deep_review: kimi-code/k3
    ui_deep: cliproxyapi/gpt-6-astra
    fast_worker: teamorouter/deepseek-flash
    ui_impl: kimi-code/k3
    note: 高级替代阶梯——订阅告急或 GPT 通道可用时按角色显式切换；findings 不得与 owner 同厂
  contextPromotion:
    enabled: true
    from: kimi-code/k3-256k
    to: kimi-code/k3
    trigger: threshold-or-overflow-before-compaction
    note: 运行时要开 contextPromotion.enabled，并在 models.yml 的 kimi-code.modelOverrides.k3-256k 声明 contextPromotionTarget
  ompProviderBilling:
    kimi-code: subscription
    zhipu-coding-plan: subscription
    cliproxyapi: subscription
    teamorouter: pay-as-you-go
    deepseek: pay-as-you-go
  ompAgentFallbacks:
    team-os-planner: ["@plan_owner", "zhipu-coding-plan/glm-5.3", "kimi-code/k3-256k"]
    team-os-planner-alt: ["@plan_alt", "zhipu-coding-plan/glm-5.3"]
    team-os-deep-reviewer: ["@deep_review", "kimi-code/k3"]
    team-os-ui-designer: ["@ui_deep", "cliproxyapi/gpt-6-astra"]
    team-os-fast-scout: ["@fast_worker", "teamorouter/glm-5.3-flash-free", "teamorouter/deepseek-flash"]
    team-os-bounded-worker: ["@fast_worker", "teamorouter/glm-5.3-flash-free", "teamorouter/deepseek-flash"]
    team-os-ui-implementer: ["@ui_impl", "teamorouter/glm-5.3-flash-free"]
  # 执行档 worker 池按设计跨计费档：订阅(glm-5.3-flash，额度多)优先，
  # 溢出到按量(免费变体→deepseek)。仅这两个 agent 允许，其余链仍须同档。
  ompChainOverflowAllow:
    - team-os-fast-scout
    - team-os-bounded-worker
  providerRoutes:
    analysis: local-loopback-cliproxyapi-over-codex-oauth
    adjudication: zhipu-coding-plan-api-key
    execution: teamorouter-deepseek-flash
    standby: kimi-code-oauth-or-api-key
    noSilentCrossProviderFallback: true
  models:
    kimi-k3:
      admission: planning-and-review-standby
      runtimeModelId: k3-256k
      runtimeModelIdLong: k3
      runtimeModelIdLongContext: k3
      displayName: Kimi K3
      runtimeContextWindow: 262144
      runtimeContextWindowLong: 1048576
      evidence:
        official: flagship-long-horizon-coding-and-end-to-end-knowledge-work
        local: selected-as-planning-and-review-tier-after-gpt-owner-decision
      strengths:
        - scope-and-plan-synthesis
        - cross-boundary-design-and-state-freeze
        - final-synthesis-and-adjudication-of-review-findings
        - long-context-whole-repo-and-long-document-reading
        - worker-pack-authoring
      avoid:
        - routine-bounded-implementation
        - batch-execution-that-drains-the-shared-membership-pool
        - self-review-of-its-own-conclusions
      quotaRule: default-work-stays-on-k3-256k; the-1M-variant-is-reached-by-explicit-selection-or-automatic-promotion-on-threshold
      measuredContext:
        mainMedian: 430134
        subagentMedian: 145437
        mainShareOver256k: 0.738
        note: 整改前基线；目标是把主会话常态上下文压到 200K 以下，让晋升回归例外
        targetMainMedian: 200000
      handoffContract: owns-outcome-plan-worker-packs-adjudication-and-final-synthesis
    glm-5.3:
      admission: specialist-only-by-default
      runtimeModelId: glm-5.3
      displayName: GLM-5.3
      runtimeContextWindow: 1000000
      evidence:
        official: agentic-coding-and-terminal-tasks-sota-among-open-models
        local: selected-as-adjudication-tier-after-cn-portfolio-decision
      strengths:
        - independent-cross-vendor-red-team-of-owner-plans
        - deep-read-only-review-and-failure-surface-audit
        - second-hypothesis-in-diagnosis
        - whole-repo-text-only-analysis-at-1m-context
      avoid:
        - ui-and-visual-judgement-without-image-input
        - routine-execution-because-its-credit-coefficient-is-the-highest
        - final-synthesis-and-code-editing-during-review
      handoffContract: returns-findings-and-evidence-to-the-owner-for-adjudication
    glm-5.3-flash:
      admission: vision-and-light-execution-specialist
      runtimeModelId: glm-5.3-flash
      displayName: GLM-5.3-Flash
      runtimeContextWindow: 1000000
      evidence:
        official: native-multimodal-visual-coding-and-office-deliverables
        local: only-multimodal-model-inside-the-coding-plan
      strengths:
        - ui-ux-and-visual-judgement
        - frontend-implementation-loop-with-screenshots
        - visual-and-interaction-acceptance
        - multimodal-evidence-collection
        - low-cost-batch-execution-inside-plan-quota
      avoid:
        - cross-repository-architecture-and-contract-decisions
        - final-synthesis
        - high-risk-independent-review
      handoffContract: returns-visual-decisions-evidence-and-acceptance-to-the-owner
    deepseek-flash:
      admission: fast-specialist-with-bounded-write
      runtimeModelId: deepseek-flash
      displayName: DeepSeek V4.1 Flash
      runtimeContextWindow: 1000000
      evidence:
        official: high-throughput-efficient-agentic-and-native-multimodal
        local: cache-heavy-agent-workloads-keep-pay-as-you-go-cost-negligible
      strengths:
        - fast-repository-scouting-and-compressed-evidence-packs
        - bounded-fact-research
        - batch-classification-and-mechanical-analysis
        - independent-model-family-challenge
        - pack-driven-bounded-implementation
        - leaf-executor-runs-gates-smoke-refresh-production-preflight
        - mechanical-doc-updates-and-commit-preparation
        - cheap-image-fact-extraction-before-visual-judgement
        - model-token-and-context-accounting
      avoid:
        - final-outcome-synthesis
        - ambiguous-cross-boundary-design-ownership
        - writing-outside-the-worker-pack-write-set
        - migration-or-production-write-without-explicit-authorization-and-gates
      promotionGate:
        - provider-and-tool-resolution-proven
        - session-stop-and-resume-proven
        - assigned-write-set-is-exclusive
        - target-tests-and-diff-reviewed-by-owner
      handoffContract: returns-bounded-evidence-or-patch-and-target-validation-to-current-owner
    gpt-5.6-sol:
      admission: default-owner
      evidence:
        official: flagship-for-complex-professional-work
        local: selected-as-default-and-planning-owner-when-cli-proxy-is-available
      strengths:
        - default-outcome-and-planning-ownership
        - cross-boundary-design-and-state-freeze
      avoid:
        - routine-bounded-execution
      handoffContract: returns-decisions-and-evidence-to-the-current-owner
    gpt-6-astra:
      admission: standby-third-opinion
      evidence:
        official: hardest-work-complex-reasoning-coding-computer-use-and-research
        local: kept-as-independent-visual-and-architecture-challenge-standby
      strengths:
        - independent-visual-and-frontend-architecture-challenge
        - high-risk-independent-review
      avoid:
        - routine-bounded-execution
      handoffContract: returns-findings-and-evidence-to-the-current-owner
  routingRules:
    - one-outcome-has-one-owner
    - short-work-starts-on-the-role-default-and-promotes-only-on-threshold
    - main-session-keeps-decisions-dispatch-and-receipts-only
    - ui-and-visual-acceptance-always-route-through-the-vision-tier
    - frozen-candidates-always-get-one-cross-vendor-finding-or-an-explicit-waiver
    - planning-splits-review-planning-to-k3-and-owner-planning-to-gpt-5.6-sol
    - batch-reads-and-commands-route-to-the-execution-tier
    - when-a-subscription-window-exceeds-70-percent-downgrade-and-disclose
    - window-downgrade-outranks-the-planning-ratio-and-must-be-disclosed
    - an-exhausted-subscription-rebinds-the-affected-role-explicitly-because-no-same-tier-fallback-can-help
    - reserved-roles-are-explicitly-bound-and-never-default
    - subscribe-channel-and-pay-as-you-go-channel-never-bind-the-same-role
    - fallback-must-stay-inside-one-cost-tier-and-be-declared-in-ompAgentFallbacks
    - quota-window-work-goes-to-models-only-that-model-can-do
    - glm-heavy-review-runs-off-peak-and-deepseek-batch-runs-off-peak
    - every-dispatch-carries-a-self-sufficient-worker-pack
    - workers-never-exceed-the-worker-pack-write-set
    - fallback-never-silently-changes-owner-or-upgrades-tiers
    - terminal-mechanical-lanes-need-no-role-binding
candidates:
  - id: google-gemini
    models: [gemini-3.7-flash, gemini-cli-auto]
    intendedRoles: [multimodal-scout, long-context-evidence-researcher]
    distinctChannels: [native-multimodal, million-token-context, independent-model-family]
    runtimeStatus: not-installed-by-team-os
    admission: real-task-evidence-required
  - id: deepseek-v4
    models: [deepseek-flash, deepseek-v4-pro]
    intendedRoles: [leaf-executor, pack-driven-implementation, evidence-scout, cost-sensitive-batch-specialist]
    distinctChannels: [independent-model-family, open-weights-option, million-token-context]
    runtimeStatus: omp-role-binding-active-as-default-and-fast-worker
